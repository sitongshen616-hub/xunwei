.recipe{white-space:pre-line}.recipe small{font-size:9px;line-height:1.4;display:inline-block;margin-top:6px}dialog p{white-space:pre-line}#stage:focus-within{outline:none}main[aria-hidden="true"]{visibility:hidden}</style></head><body><main><div id="stage" aria-label="可拖动旋转的三维玛格丽特酒杯"></div><button class="home" aria-label="返回酒单主页"><svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 14 16 4l12 10v14h-9v-9h-6v9H4Z"/></svg></button><div class="hint">DRAG TO ROTATE · 拖动旋转</div><hgroup><h1>玛格丽特</h1><p>MARGARITA</p></hgroup><aside class="recipe"><b>基酒</b>龙舌兰 / TEQUILA<b>调味</b>青柠汁<br>橙味利口酒<b>酒精度</b>≈ 24% vol<br><small>依实际配方而异</small></aside><section class="details"><header>推荐搭配 <small style="font-size:9px">FOOD PAIRING</small></header><p>墨西哥玉米片 · 牛油果沙拉<br>炭烤鲜虾，唤醒清爽酸香。</p><button id="history">酒的历史 <span style="float:right"></span></button></section><button class="order" id="order">立即下单</button><div class="foot">寻味 / A TASTE TO REMEMBER</div></main><dialog id="modal"><h2 id="title"></h2><p id="content"></p><button id="close">关闭</button></dialog><script type="module">import * as THREE from 'https://esm.sh/three@0.170.0';
import * as T from 'https://esm.sh/three@0.170.0';
import {RoundedBoxGeometry} from 'https://esm.sh/three@0.170.0/examples/jsm/geometries/RoundedBoxGeometry.js';

const glass=new T.MeshPhysicalMaterial({color:'#fff7ef',roughness:.055,metalness:.03,transparent:true,opacity:.25,clearcoat:1,side:T.DoubleSide,depthWrite:false,envMapIntensity:1.1});
const iceMaterial=new T.MeshPhysicalMaterial({color:'#effaff',roughness:.07,metalness:.02,transparent:true,opacity:.58,clearcoat:1,depthWrite:false,envMapIntensity:1.6});
const iceGeometry=new RoundedBoxGeometry(.47,.43,.45,3,.065);
const white=new T.MeshStandardMaterial({color:'#fff5d6',roughness:.5});
const sphere=new T.SphereGeometry(1,12,8);
function material(color,roughness=.3){return new T.MeshPhysicalMaterial({color,roughness,clearcoat:.65})}
function mesh(parent,geo,mat,pos=[0,0,0]){const m=new T.Mesh(geo,mat);m.position.set(...pos);parent.add(m);return m}
function lathe(parent,points,mat){return mesh(parent,new T.LatheGeometry(points.map(p=>new T.Vector2(...p)),96),mat)}
function line(parent,points,color='#fff2d0',opacity=.5){const l=new T.Line(new T.BufferGeometry().setFromPoints(points.map(p=>new T.Vector3(...p))),new T.LineBasicMaterial({color,transparent:true,opacity}));parent.add(l);return l}
function torus(parent,r,y,mat,tube=.016){const m=mesh(parent,new T.TorusGeometry(r,tube,8,96),mat,[0,y,0]);m.rotation.x=Math.PI/2;return m}
function ice(parent,positions){for(let i=0;i<positions.length;i++){const m=mesh(parent,iceGeometry,iceMaterial,positions[i]);m.rotation.set(i*.23,i*.8,.12+i*.15);line(m,[[-.18,.218,-.1],[-.04,.218,.01],[.04,.218,-.05],[.18,.218,.14]],'#ffffff',.7);const frost=mesh(m,sphere,new T.MeshStandardMaterial({color:'#ffffff',transparent:true,opacity:.12,depthWrite:false}));frost.scale.set(.13,.1,.12)}}
function citrus(parent,{x,y,z=0,r=.42,orange=false,lemon=false,tilt=-.3}){const g=new T.Group();parent.add(g);g.position.set(x,y,z);g.rotation.z=tilt;const peel=material(orange?'#d98121':lemon?'#c9ad20':'#537b1d',.55);const cyl=mesh(g,new T.CylinderGeometry(r,r,.075,64),peel);cyl.rotation.x=Math.PI/2;
 for(const side of [-1,1]){const pith=mesh(g,new T.CircleGeometry(r*.94,64),white,[0,0,side*.04]);if(side<0)pith.rotation.y=Math.PI;for(let k=0;k<10;k++){const pulp=material(orange?(k%2?'#f6b649':'#ffc56b'):lemon?'#f1df83':(k%2?'#d5df76':'#e6e89d'),.23);pulp.side=T.DoubleSide;mesh(g,new T.CircleGeometry(r*.84,12,k*Math.PI/5+.024,Math.PI/5-.048),pulp,[0,0,side*.043])}const cells=new T.InstancedMesh(sphere,material(orange?'#ffda8c':'#f6f0b5',.2),130);const dummy=new T.Object3D();for(let k=0;k<130;k++){const a=k*2.39996,rad=r*.8*Math.sqrt((k+.5)/130);dummy.position.set(Math.cos(a)*rad,Math.sin(a)*rad,side*.048);dummy.rotation.z=a;dummy.scale.set(.009,.025,.005);dummy.updateMatrix();cells.setMatrixAt(k,dummy.matrix)}g.add(cells)}return g}
function cherry(parent,x,y,z){const c=mesh(parent,sphere,material('#64132b',.12),[x,y,z]);c.scale.set(.13,.13,.13);line(parent,[[x,y+.11,z],[x+.04,y+.3,z],[x+.18,y+.43,z-.03]],'#604829',1)}
function ribbon(parent,points,color,width=.09){const vertices=[];for(const [x,y,z]of points){vertices.push(x,y-width,z,x,y+width,z)}const indices=[];for(let i=0;i<points.length-1;i++){let a=i*2;indices.push(a,a+1,a+2,a+1,a+3,a+2)}const geo=new T.BufferGeometry();geo.setAttribute('position',new T.Float32BufferAttribute(vertices,3));geo.setIndex(indices);geo.computeVertexNormals();const mat=material(color,.4);mat.side=T.DoubleSide;mesh(parent,geo,mat)}
function bubbles(parent,r,bottom,top,count=45){const m=new T.InstancedMesh(sphere,new T.MeshPhysicalMaterial({color:'#fff6d8',transparent:true,opacity:.4,roughness:.08,depthWrite:false}),count);const d=new T.Object3D();for(let k=0;k<count;k++){let a=k*2.39996,rad=r*Math.sqrt(((k*37)%count)/count);d.position.set(Math.cos(a)*rad,bottom+(top-bottom)*((k*13)%count)/count,Math.sin(a)*rad);d.scale.setScalar(.007+(k%4)*.003);d.updateMatrix();m.setMatrixAt(k,d.matrix)}parent.add(m)}
function cocktailModel(i){const g=new T.Group();g.userData.index=i;const colors=['#efd785','#dae0b0','#b92e1d','#b57425','#eee5c1','#e2dba6','#793021','#cf5a79','#d9ad52','#f3e6bd'];const liquid=material(colors[i],i===9?.32:.1);liquid.transparent=i!==9;liquid.opacity=i===4?.34:i===5?.65:.83;liquid.depthWrite=false;
let profile,fill,r,top,bottom;
if(i===0){profile=[[0,-1.9],[.76,-1.9],[.8,-1.85],[.22,-1.74],[.08,-1.5],[.07,-.55],[.22,-.42],[.39,-.2],[.52,.13],[.78,.35],[1.12,.58],[1.27,.84],[1.3,1.08]];fill=[[0,-.37],[.24,-.32],[.37,-.12],[.48,.19],[.74,.4],[1.06,.63],[1.2,.91],[0,.91]];r=1.3;top=1.08;bottom=-.3}
else if(i===1){profile=[[0,-1.6],[.55,-1.6],[.61,-1.5],[.64,1.35],[.63,1.4]];fill=[[0,-1.42],[.53,-1.42],[.57,1.17],[0,1.17]];r=.64;top=1.4;bottom=-1.4}
else if(i===2||i===3){r=i===2?.85:.79;top=.55;bottom=-1.05;profile=[[0,-1.25],[r-.06,-1.25],[r,-1.12],[r+.025,top]];fill=[[0,bottom],[r-.08,bottom],[r-.06,.37],[0,.37]]}
else if(i===4||i===7){r=i===4?1.24:1.12;top=1.12;bottom=-.45;profile=[[0,-1.9],[.74,-1.9],[.77,-1.85],[.14,-1.7],[.055,-.58],[.12,-.47],[r,top]];fill=[[0,-.43],[.1,-.39],[r*.87,.92],[0,.92]]}
else if(i===5||i===6){r=i===5?1.03:.9;top=.93;bottom=-.25;profile=[[0,-1.9],[.68,-1.9],[.7,-1.85],[.12,-1.65],[.055,-.43],[.27,-.27],[.58,-.08],[r,.35],[r+.04,.72],[r,top]];fill=[[0,-.22],[.29,-.16],[.57,.02],[r-.06,.4],[r-.05,.74],[0,.74]]}
else if(i===8){r=.74;top=.95;bottom=-.75;profile=[[0,-1.6],[.61,-1.6],[.65,-1.54],[.1,-1.4],[.07,-1.05],[.38,-.78],[.66,-.28],[.75,.5],[r,top]];fill=[[0,bottom],[.3,-.66],[.57,-.22],[.66,.43],[.66,.73],[0,.73]]}
else{r=.7;top=1.5;bottom=-.7;profile=[[0,-1.9],[.65,-1.9],[.68,-1.84],[.13,-1.65],[.09,-1.06],[.48,-.82],[.77,-.38],[.79,.15],[.62,.82],[.64,1.2],[.7,top]];fill=[[0,-.72],[.39,-.68],[.68,-.3],[.69,.15],[.54,.83],[.56,1.25],[0,1.25]]}
lathe(g,profile,glass);lathe(g,fill,liquid);torus(g,r,top,glass);const sy=fill[fill.length-1][1],sr=fill[fill.length-2][0];const surf=mesh(g,new T.CircleGeometry(sr,64),liquid,[0,sy,0]);surf.rotation.x=-Math.PI/2;torus(g,sr,sy,glass,.008);
if(i===0){ice(g,[[-.6,.9,.2],[0,.94,.5],[.5,.95,.1],[.2,.93,-.5],[-.4,.92,-.35]]);citrus(g,{x:-1.05,y:1.25,r:.48});const salt=new T.InstancedMesh(new T.BoxGeometry(.027,.025,.029),white,190),d=new T.Object3D();for(let k=0;k<190;k++){const a=k*2.39996;d.position.set(Math.cos(a)*r,top+.018+(k%3)*.008,Math.sin(a)*r);d.rotation.set(k,k*.4,k*.8);d.updateMatrix();salt.setMatrixAt(k,d.matrix)}g.add(salt);bubbles(g,.46,-.15,.55)}
if(i===1){ice(g,Array.from({length:15},(_,k)=>[Math.sin(k*2.4)*.34,-1.05+k*.155,Math.cos(k*2.4)*.32]));citrus(g,{x:.47,y:1.32,r:.34});for(let k=0;k<8;k++){const leaf=mesh(g,sphere,material(k%2?'#638b35':'#3e6b2c',.6),[Math.sin(k*2.4)*.28,1.22+(k%3)*.15,Math.cos(k*2.4)*.28]);leaf.scale.set(.12,.26,.025);leaf.rotation.set(.4,k,.5*k)}bubbles(g,.5,-1.2,1.1,70)}
if(i===2){ice(g,[[-.35,.25,.16],[.2,.31,.26],[.13,.3,-.29]]);citrus(g,{x:.62,y:.56,r:.43,orange:true,tilt:.5})}
if(i===3){const big=mesh(g,new RoundedBoxGeometry(.92,.87,.87,4,.09),iceMaterial,[0,-.01,0]);big.rotation.y=.4;const points=Array.from({length:35},(_,k)=>{const a=k*.15;return[Math.cos(a)*.54,.55+k*.003,Math.sin(a)*.54]});ribbon(g,points,'#e39424',.07);for(let k=0;k<14;k++)line(g,[[Math.cos(k*Math.PI/7)*.78,-1.05,Math.sin(k*Math.PI/7)*.78],[Math.cos(k*Math.PI/7)*.8,.48,Math.sin(k*Math.PI/7)*.8]],'#fff5e5',.18)}
if(i===4){line(g,[[-.7,1.16,-.12],[.85,1.03,.22]],'#ac8d57',1);for(let k=0;k<2;k++){const olive=mesh(g,sphere,material('#84923e',.25),[-.28+k*.4,1.12-k*.04,.02+k*.08]);olive.scale.set(.17,.12,.12);const pit=mesh(olive,sphere,material('#aa4a32'),[.7,0,.4]);pit.scale.set(.25,.4,.4)}}
if(i===5){ribbon(g,Array.from({length:30},(_,k)=>[.52+Math.sin(k*.2)*.17,.93-k*.018,Math.cos(k*.2)*.17]),'#b2b14c',.035)}
if(i===6)cherry(g,.35,.78,.24);
if(i===7)ribbon(g,Array.from({length:30},(_,k)=>[.65+Math.sin(k*.22)*.19,1.12-k*.008,Math.cos(k*.22)*.2]),'#e69b45',.045);
if(i===8){const foam=lathe(g,[[0,.72],[.65,.72],[.67,.78],[.64,.81],[0,.81]],material('#fff3da',.8));citrus(g,{x:.52,y:.89,r:.31,lemon:true});cherry(g,.28,.84,.28);bubbles(g,.5,-.35,.55)}
if(i===9){const pineapple=new T.Group();pineapple.position.set(-.57,1.47,0);pineapple.rotation.z=.3;g.add(pineapple);const wedge=new T.Shape();wedge.moveTo(0,0);wedge.lineTo(-.1,.72);wedge.lineTo(.55,.4);wedge.closePath();mesh(pineapple,new T.ExtrudeGeometry(wedge,{depth:.09,bevelEnabled:true,bevelSize:.025,bevelThickness:.02,bevelSegments:2,steps:1}),material('#e9c64d',.5));for(let k=0;k<5;k++)line(pineapple,[[.02,k*.1+.08,.12],[.4-k*.06,k*.1+.15,.12]],'#c49e38',.7);cherry(g,.46,1.5,.08);const straw=mesh(g,new T.CylinderGeometry(.025,.025,2.1,12),material('#9f4965'),[.31,1.3,-.12]);straw.rotation.z=-.15}
return g}

function studioEnvironment(renderer,scene){const c=document.createElement('canvas');c.width=512;c.height=256;const x=c.getContext('2d'),gr=x.createLinearGradient(0,0,512,0);gr.addColorStop(0,'#765b64');gr.addColorStop(.2,'#fff4e3');gr.addColorStop(.25,'#b29b99');gr.addColorStop(.6,'#efe6dc');gr.addColorStop(1,'#96717e');x.fillStyle=gr;x.fillRect(0,0,512,256);x.fillStyle='#ffffff';x.fillRect(70,15,32,220);x.fillRect(330,35,15,185);const tex=new T.CanvasTexture(c);tex.mapping=T.EquirectangularReflectionMapping;const pmrem=new T.PMREMGenerator(renderer);scene.environment=pmrem.fromEquirectangular(tex).texture;tex.dispose();pmrem.dispose()}

// The displayed strength is an estimate after dilution, not a laboratory value.
const drinkPages=[
{id:'margarita',name:'玛格丽特',english:'Margarita',base:'龙舌兰',seasoning:'青柠汁 · 橙味利口酒',abv:'≈ 24%',pairing:'墨西哥玉米片 · 牛油果沙拉\n炭烤鲜虾，衬托青柠的明亮酸香。',formula:'龙舌兰 50 ml、橙味利口酒 20 ml、青柠汁 15 ml。',story:'龙舌兰、橙味利口酒与青柠汁，让这杯经典鸡尾酒拥有明亮的酸甜与盐边。关于玛格丽特的诞生，有多种流传的说法，确切的发明者与年份仍有争议。如今，它已成为龙舌兰鸡尾酒中极具代表性的一杯。'},
{id:'mojito',name:'莫吉托',english:'Mojito',base:'白朗姆',seasoning:'青柠 · 薄荷\n糖 · 苏打水',abv:'≈ 10%',pairing:'香烤鸡肉 · 柑橘海鲜沙拉\n薄荷与气泡带来轻盈、清新的收尾。',formula:'白朗姆 45 ml、青柠汁 20 ml、白砂糖 2 茶匙、薄荷 6 枝，苏打水补足。',story:'莫吉托与古巴的饮酒文化紧密相连。朗姆、青柠、薄荷、糖与苏打，组成一杯清爽的长饮。关于它更早的雏形，有不同的民间叙述；与其认定唯一的起源，不如将它看作古巴朗姆与新鲜草本共同演变出的经典。'},
{id:'negroni',name:'尼格罗尼',english:'Negroni',base:'金酒',seasoning:'金巴利\n甜味美思',abv:'≈ 24%',pairing:'熟成奶酪 · 橄榄 · 意式火腿\n咸香小食呼应浓郁的草本苦甜。',formula:'金酒 30 ml、金巴利 30 ml、甜味美思 30 ml，冰块搅拌，橙片装饰。',story:'尼格罗尼来自意大利的开胃酒传统。广为流传的说法是，它由美式鸡尾酒演变而来，以金酒替代苏打水，形成更浓郁的结构。金酒、金巴利与甜味美思的等份组合，让草本、苦味与甜香彼此平衡。'},
{id:'old-fashioned',name:'古典',english:'Old Fashioned',base:'波本威士忌',seasoning:'方糖\n芳香苦精 · 橙皮',abv:'≈ 30%',pairing:'炭烤牛排 · 烟熏坚果\n焦香与橙皮香衬托威士忌的醇厚。',formula:'波本或黑麦威士忌 45 ml、方糖 1 块、芳香苦精数滴、少量水。',story:'古典鸡尾酒保留了早期鸡尾酒的基本结构：烈酒、糖、水与苦精。当调酒的变化越来越多，人们开始用“老式的方式”来称呼这种朴素的组合。它的魅力来自对威士忌本身的呈现，橙皮则为木质与香草气息添上明亮的一笔。'},
{id:'dry-martini',name:'干马天尼',english:'Dry Martini',base:'金酒',seasoning:'干味美思\n橄榄',abv:'≈ 30%',pairing:'生蚝 · 橄榄 · 柠檬烤鱼\n海鲜的鲜味映衬干爽草本香。',formula:'金酒 60 ml、干味美思 10 ml，加冰搅拌后滤入冷却酒杯。',story:'马天尼在美国鸡尾酒文化中逐渐成形，它与马丁内兹等早期酒款的关系常被讨论，起源并没有单一结论。随时代变化，配方逐渐走向更干爽、以金酒为主的风格。橄榄与柠檬皮，是它最常见的两种装饰方向。'},
{id:'daiquiri',name:'代基里',english:'Daiquiri',base:'白朗姆',seasoning:'青柠汁\n白砂糖',abv:'≈ 20%',pairing:'烤虾 · 炸鱼 · 青柠鸡肉\n清澈酸甜与酥脆口感相互映衬。',formula:'白朗姆 60 ml、青柠汁 20 ml、细白砂糖 2 茶匙，摇和滤入冷杯。',story:'代基里的名字与古巴同名地区相连。白朗姆、青柠与糖构成简洁的酸酒结构，后来也发展出冰沙、水果等许多变体。这里展示的是经典的滤冰版本：没有繁复装饰，让朗姆的香气与青柠的酸度直接相遇。'},

const viewObserver=new ResizeObserver(renderSize);viewObserver.observe(gallery);viewObserver.observe(stage);let previousFrame=0;rr.setAnimationLoop(now=>{const dt=previousFrame?Math.min(40,now-previousFrame):16.67;previousFrame=now;if(lobby.hidden){if(!detailDrag){detailAngle+=(detailVelocity+AUTO_ROTATE_RADIANS_PER_SECOND/1000)*dt;detailVelocity*=Math.exp(-dt/180)}detailModel().rotation.y=detailAngle;rr.render(scene2,cam2);return;}if(!dragging){if(mode==='coast'){rotation+=velocity*dt;velocity*=Math.exp(-dt/190);if(Math.abs(velocity)<.00022){target=Math.round(rotation/step)*step;mode='snap'}}else{rotation+=(target-rotation)*(1-Math.exp(-dt/100));if(Math.abs(target-rotation)<.0001)rotation=target}}updateSelection();models.forEach((g,i)=>{const a=i*step+rotation,front=(Math.cos(a)+1)/2;g.position.set(Math.sin(a)*4.4,0,Math.cos(a)*3.3-3.3);g.rotation.y=-a*.35;g.scale.setScalar(.56+front*.44);g.visible=Math.cos(a)>-.65});rr.render(scene2,cam2)});
